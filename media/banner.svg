<svg width="1280" height="300" viewBox="0 0 1280 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QueraCode">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A2A"/>
      <stop offset="0.55" stop-color="#0C2A40"/>
      <stop offset="1" stop-color="#0E3350"/>
    </linearGradient>
    <linearGradient id="code" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B4E6"/>
      <stop offset="1" stop-color="#0099CC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B4E6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00B4E6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- full-bleed background -->
  <rect width="1280" height="300" rx="28" fill="url(#bg)"/>
  <!-- decorative Quera-blue accents (right side) -->
  <circle cx="1180" cy="70" r="240" fill="url(#glow)" opacity="0.5"/>
  <circle cx="1150" cy="150" r="150" fill="none" stroke="#00B4E6" stroke-width="1.5" opacity="0.14"/>
  <circle cx="1150" cy="150" r="210" fill="none" stroke="#0099CC" stroke-width="1.5" opacity="0.10"/>
  <g opacity="0.16" stroke="#7FE3FF" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M980 118 l-26 32 26 32"/>
    <path d="M1064 118 l26 32 -26 32"/>
    <path d="M1036 104 l-24 92"/>
  </g>

  <!-- logo tile with the authentic Quera Q mark, vertically centered (center y=150) -->
  <g filter="url(#soft)">
    <rect x="72" y="76" width="148" height="148" rx="34" fill="#FFFFFF"/>
    <g transform="translate(98,102) scale(0.1925)" fill="#0099CC">
      <path d="M249.35 0C111.64 0 0 111.63 0 249.34s111.64 249.34 249.35 249.34c137.71 0 249.34-111.63 249.34-249.34S387.08 0 249.35 0zm146.88 319.35a76.18 76.18 0 0 1-8.67 35.38l-122-122-32.48 32.47 150.29 150.25-16.09 16.11.15.15a122.37 122.37 0 0 0-86.55-35.85H178.97a76.5 76.5 0 0 1-76.5-76.5v-140.8a76.5 76.5 0 0 1 76.5-76.5h140.76a76.5 76.5 0 0 1 76.5 76.5z"/>
    </g>
  </g>

  <!-- wordmark + subtitle, aligned to the logo's vertical center -->
  <text x="266" y="152" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="72" letter-spacing="-2" fill="#F8FAFC">Quera<tspan fill="url(#code)">Code</tspan></text>
  <rect x="268" y="168" width="152" height="5" rx="2.5" fill="#00B4E6" opacity="0.9"/>
  <text x="269" y="208" font-family="'Inter', sans-serif" font-weight="500" font-size="24" letter-spacing="0.2" fill="#9FB6C6">The all-in-one Quera workbench for Visual Studio Code</text>
</svg>
