name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm run unit
      - name: Command registration sweep
        if: matrix.os == 'ubuntu-latest' && matrix.node == '20'
        shell: bash
        env:
          QUERA_SESSION_ID: ${{ secrets.QUERA_SESSION_ID }}
        run: |
          if [ -z "$QUERA_SESSION_ID" ]; then
            echo "No QUERA_SESSION_ID secret available - skipping the live sweep."
            exit 0
          fi
          npm run test:commands

  package:
    name: Package .vsix
    runs-on: ubuntu-latest
    needs: [manifest, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build the extension package
        run: npx --yes @vscode/vsce package --out queracode.vsix
      - name: Check what ships
        run: npx --yes @vscode/vsce ls --tree
      - uses: actions/upload-artifact@v4
        with:
          name: queracode-vsix
          path: queracode.vsix
          if-no-files-found: error
          retention-days: 30
